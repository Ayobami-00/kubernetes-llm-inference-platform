---
- name: Require explicit firewall ownership for every new worker
  ansible.builtin.assert:
    that:
      - >-
        klip_firewall_file is defined or
        (inventory_hostname in ['cp-01', 'cp-02', 'cp-03', 'platform-01', 'platform-02', 'platform-03']
        and klip_node.provider == 'aws')
    fail_msg: New workers require their scoped firewall input; only retained CPU firewalls may be preserved
- name: Inspect retained CPU firewall without changing it
  when: klip_firewall_file is not defined
  ansible.builtin.stat:
    path: /etc/klip/firewall.rules
    follow: false
  register: klip_wireguard_retained_firewall
- name: Require a protected retained CPU firewall
  when: klip_firewall_file is not defined
  ansible.builtin.assert:
    that:
      - klip_wireguard_retained_firewall.stat.exists
      - klip_wireguard_retained_firewall.stat.isreg | default(false)
      - klip_wireguard_retained_firewall.stat.uid | default(-1) == 0
      - klip_wireguard_retained_firewall.stat.gid | default(-1) == 0
      - klip_wireguard_retained_firewall.stat.mode | default('') == '0600'
    fail_msg: The CPU peer-only handoff requires its existing root-owned firewall
- name: Write versioned public peer registry
  ansible.builtin.copy:
    src: '{{ klip_peer_registry }}'
    dest: /etc/klip/peers.next.json
    mode: '0600'
- name: Reconcile peers while preserving gateway selection
  ansible.builtin.command: python3 /usr/local/sbin/klip-node mesh
  changed_when: false
- name: Enable persistent WireGuard interface
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
- name: Install scoped firewall rules
  when: klip_firewall_file is defined
  ansible.builtin.copy:
    src: '{{ klip_firewall_file }}'
    dest: /etc/klip/firewall.rules
    mode: '0600'
- name: Install firewall service
  when: klip_firewall_file is defined
  ansible.builtin.copy:
    dest: /etc/systemd/system/klip-firewall.service
    mode: '0644'
    content: |
      [Unit]
      Description=KLIP scoped host firewall
      After=network-pre.target
      Before=kubelet.service
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/python3 /usr/local/sbin/klip-node firewall
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
- name: Apply dedicated firewall chains
  when: klip_firewall_file is defined
  ansible.builtin.systemd_service:
    name: klip-firewall
    state: restarted
    enabled: true
    daemon_reload: true
- name: Install API route helper timer
  when: klip_node.role != 'control_plane'
  block:
    - name: Install public cluster CA for gateway probes
      ansible.builtin.copy:
        src: '{{ klip_ca_bundle }}'
        dest: /etc/klip/ca.crt
        mode: '0644'
    - name: Install route helper service
      ansible.builtin.copy:
        dest: /etc/systemd/system/klip-api-route.service
        mode: '0644'
        content: |
          [Unit]
          Description=KLIP private API gateway selection
          After=wg-quick@wg0.service
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /usr/local/sbin/klip-node route
          TimeoutStartSec=10
    - name: Install route helper timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/klip-api-route.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Probe private API gateways every five seconds
          [Timer]
          OnBootSec=5s
          OnUnitInactiveSec=5s
          AccuracySec=1s
          [Install]
          WantedBy=timers.target
    - name: Select initial healthy API gateway
      ansible.builtin.command: python3 /usr/local/sbin/klip-node route
      changed_when: false
    - name: Enable API route timer
      ansible.builtin.systemd_service:
        name: klip-api-route.timer
        state: started
        enabled: true
        daemon_reload: true
