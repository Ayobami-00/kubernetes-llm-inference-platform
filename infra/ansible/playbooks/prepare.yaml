---
- name: Prepare verified hosts without initializing Kubernetes
  hosts: all
  become: true
  serial: 1
  roles:
    - role: klip_gpu_host
      when: klip_node.runtime_profile | default('standard') == 'nvidia-operator'
    - klip_base
    - role: klip_storage
      when: klip_node.role == 'control_plane'
    - klip_runtime
    - klip_telemetry
