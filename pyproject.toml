[project]
name = "kubernetes-llm-inference-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/platform-contracts"]

[tool.uv.sources]
platform-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4,<5"]
infrastructure = ["ansible-core==2.21.6", "ansible-lint==26.10.1", "platform-contracts"]

[tool.pytest.ini_options]
testpaths = ["packages/platform-contracts/tests", "tests/infrastructure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
