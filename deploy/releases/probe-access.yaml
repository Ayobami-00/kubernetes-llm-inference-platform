apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-probe
  namespace: klip-acceptance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-probe
  namespace: klip-acceptance
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: network-probe
  namespace: klip-acceptance
subjects:
  - kind: ServiceAccount
    name: network-probe
    namespace: klip-acceptance
roleRef:
  kind: Role
  name: network-probe
  apiGroup: rbac.authorization.k8s.io
