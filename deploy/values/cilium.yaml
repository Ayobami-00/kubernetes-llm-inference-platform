kubeProxyReplacement: false
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
MTU: 1420
devices: wg0
encryption:
  enabled: false
envoy:
  enabled: false
l7Proxy: false
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
certgen:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ''
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
operator:
  replicas: 2
  skipCRDCreation: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/control-plane: ''
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 384Mi}
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
  - key: node.cilium.io/agent-not-ready
    operator: Exists
  - key: klip.io/acceptance-only
    operator: Exists
    effect: NoSchedule
  - key: klip.dev/bootstrap
    operator: Exists
    effect: NoSchedule
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
hubble:
  enabled: true
  relay:
    enabled: true
    replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {k8s-app: hubble-relay}
            topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/control-plane: ''
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
  ui:
    enabled: false
