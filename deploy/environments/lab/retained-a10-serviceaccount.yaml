apiVersion: v1
kind: ServiceAccount
metadata:
  name: klip-model-release
  namespace: llm-d
  annotations:
    eks.amazonaws.com/ecr-role-arn: arn:aws:iam::127811062476:role/kubernetes-llm-inference-platform/klip-images-model-pull
automountServiceAccountToken: false
---
# Kubernetes 1.36 NodeRestriction requires an explicit audience grant when no
# token volume exists. Scope it to one node, one namespace, one SA and STS only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retained-a10-model-pull-audience
  namespace: llm-d
rules:
  - apiGroups: [""]
    resources: [sts.amazonaws.com]
    resourceNames: [klip-model-release]
    verbs: [request-serviceaccounts-token-audience]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retained-a10-model-pull-audience
  namespace: llm-d
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retained-a10-model-pull-audience
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:node:writer-a10-retained
