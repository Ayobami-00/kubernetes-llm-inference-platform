apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: klip-grafana
  namespace: platform-data
  labels: {klip.dev/managed-by: klip-observability}
  annotations: {helm.sh/resource-policy: keep}
spec:
  cluster: {name: klip-db}
  name: grafana
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  inherit: true
  connectionLimit: 25
  databaseRoleReclaimPolicy: retain
  passwordSecret: {name: klip-grafana-database}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: klip-grafana
  namespace: platform-data
  labels: {klip.dev/managed-by: klip-observability}
  annotations: {helm.sh/resource-policy: keep}
spec:
  cluster: {name: klip-db}
  name: grafana
  owner: grafana
  databaseReclaimPolicy: retain
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: klip-grafana-database
  namespace: platform-data
  labels: {klip.dev/managed-by: klip-observability}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: klip-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: klip-grafana}
      ports: [{protocol: TCP, port: 5432}]
