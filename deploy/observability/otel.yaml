fullnameOverride: klip-otel
mode: statefulset
replicaCount: 2
nodeSelector:
  klip.dev.node-restriction.kubernetes.io/platform: 'true'
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels: {app.kubernetes.io/name: opentelemetry-collector, app.kubernetes.io/instance: klip-otel}
podDisruptionBudget: {enabled: true, minAvailable: 1}
image:
  repository: docker.io/otel/opentelemetry-collector-contrib
  tag: 0.163.2
command: {name: otelcol-contrib}
serviceAccount:
  create: true
  name: klip-otel
  automountServiceAccountToken: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 512Mi}
extraEnvs: [{name: AWS_EC2_METADATA_DISABLED, value: 'true'}]
extraVolumeMounts:
  - {name: queue, mountPath: /var/lib/otelcol}
statefulset:
  volumeClaimTemplates:
    - metadata: {name: queue}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: klip-gp3
        resources: {requests: {storage: 5Gi}}
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: {endpoint: '${env:MY_POD_IP}:4317'}
        http: {endpoint: '${env:MY_POD_IP}:4318'}
  extensions:
    health_check: {endpoint: '${env:MY_POD_IP}:13133'}
    file_storage:
      directory: /var/lib/otelcol
      timeout: 10s
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 15}
    batch: {timeout: 1s, send_batch_size: 256, send_batch_max_size: 512}
  exporters:
    debug: null
    otlphttp/logs:
      endpoint: http://klip-loki.observability.svc:3100/otlp
      timeout: 10s
      retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 300s}
      sending_queue: {enabled: true, num_consumers: 2, queue_size: 1000, storage: file_storage}
    otlp/traces:
      endpoint: klip-tempo.observability.svc:4317
      tls: {insecure: true}
      timeout: 10s
      retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 300s}
      sending_queue: {enabled: true, num_consumers: 2, queue_size: 1000, storage: file_storage}
  service:
    extensions: [health_check, file_storage]
    pipelines:
      metrics: null
      logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/logs]}
      traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/traces]}
serviceMonitor:
  enabled: true
  extraLabels: {release: klip-monitoring}
