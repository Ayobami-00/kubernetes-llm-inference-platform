backend:
  replicas: 0
chunksCache:
  enabled: false
defaults:
  automountServiceAccountToken: false
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  extraEnv:
  - name: AWS_EC2_METADATA_DISABLED
    value: 'true'
  nodeSelector:
    klip.dev.node-restriction.kubernetes.io/platform: 'true'
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
deploymentMode: Monolithic
fullnameOverride: klip-loki
gateway:
  enabled: false
loki:
  analytics:
    reporting_enabled: false
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  compactor:
    delete_request_store: s3
    retention_delete_delay: 2h
    retention_delete_worker_count: 5
    retention_enabled: true
    working_directory: /var/loki/compactor
  ingester:
    chunk_idle_period: 5m
    max_chunk_age: 1h
    wal:
      dir: /var/loki/wal
      enabled: true
  limits_config:
    allow_structured_metadata: true
    ingestion_burst_size_mb: 4
    ingestion_rate_mb: 2
    max_global_streams_per_user: 5000
    max_line_size: 65536
    max_query_parallelism: 4
    max_query_series: 500
    query_timeout: 30s
    retention_period: 720h
  schemaConfig:
    configs:
    - from: '2026-11-01'
      index:
        period: 24h
        prefix: index_
      object_store: s3
      schema: v13
      store: tsdb
  storage:
    bucketNames:
      chunks: klip-logs-127811062476-eu-west-2
      ruler: klip-logs-127811062476-eu-west-2
    s3:
      insecure: false
      region: eu-west-2
    type: s3
lokiCanary:
  enabled: false
memcached:
  enabled: false
  serviceAccount:
    create: false
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: klip-monitoring
rbac:
  namespaced: true
read:
  replicas: 0
resultsCache:
  enabled: false
serviceAccount:
  automountServiceAccountToken: false
  create: true
  name: klip-loki
sidecar:
  rules:
    enabled: false
singleBinary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: klip-gp3
    whenDeleted: Retain
    whenScaled: Retain
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  replicas: 3
  resources:
    limits:
      cpu: '1'
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
  sidecar: false
test:
  enabled: false
write:
  replicas: 0
