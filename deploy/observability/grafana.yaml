fullnameOverride: klip-grafana
replicas: 2
automountServiceAccountToken: false
serviceAccount:
  name: klip-grafana
  automountServiceAccountToken: false
rbac:
  create: false
nodeSelector:
  klip.dev.node-restriction.kubernetes.io/platform: 'true'
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - topologyKey: kubernetes.io/hostname
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
          app.kubernetes.io/instance: klip-grafana
podDisruptionBudget:
  minAvailable: 1
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
persistence:
  enabled: false
initChownData:
  enabled: false
testFramework:
  enabled: false
admin:
  existingSecret: klip-grafana-credentials
extraSecretMounts:
- name: database-ca
  mountPath: /etc/grafana/database-ca
  secretName: klip-grafana-database-ca
  readOnly: true
  optional: false
- name: runtime-secrets
  mountPath: /etc/grafana/runtime-secrets
  secretName: klip-grafana-credentials
  readOnly: true
  optional: false
env:
  AWS_EC2_METADATA_DISABLED: 'true'
grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  auth.basic:
    enabled: true
  security:
    secret_key: $__file{/etc/grafana/runtime-secrets/encryption-key}
    cookie_secure: true
    cookie_samesite: strict
    disable_gravatar: true
    strict_transport_security: true
    content_security_policy: true
  database:
    type: postgres
    host: klip-db-rw.platform-data.svc:5432
    name: grafana
    user: grafana
    password: $__file{/etc/grafana/runtime-secrets/database-password}
    ssl_mode: verify-full
    ca_cert_path: /etc/grafana/database-ca/ca.crt
    max_open_conn: 10
    max_idle_conn: 2
    conn_max_lifetime: 300
  server:
    domain: grafana.klip-lab.click
    root_url: https://grafana.klip-lab.click/
  unified_alerting:
    enabled: false
  live:
    max_connections: 0
  log:
    mode: console
    level: info
  plugins:
    preinstall_disabled: true
    preinstall_auto_update: false
    disable_plugins: cloudwatch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb
  metrics:
    enabled: true
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Metrics
      uid: klip-metrics
      type: prometheus
      access: proxy
      url: http://klip-thanos-query.observability.svc:9090
      isDefault: true
      editable: false
      jsonData:
        httpMethod: POST
        timeInterval: 30s
        queryTimeout: 30s
        prometheusType: Thanos
    - name: Logs
      uid: klip-logs
      type: loki
      access: proxy
      url: http://klip-loki.observability.svc:3100
      editable: false
      jsonData:
        maxLines: 1000
    - name: Traces
      uid: klip-traces
      type: tempo
      access: proxy
      url: http://klip-tempo.observability.svc:3200
      editable: false
serviceMonitor:
  enabled: true
  labels:
    release: klip-monitoring
  interval: 30s
  scrapeTimeout: 10s
sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false
