name: Infrastructure checks

on:
  push:
    paths:
      - 'infra/**'
      - 'charts/**'
      - 'deploy/**'
      - 'scripts/infrastructure/**'
      - 'tests/infrastructure/**'
      - '.github/workflows/infrastructure-checks.yaml'
      - '.tflint.hcl'
      - '.terraform-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
  pull_request:
    paths:
      - 'infra/**'
      - 'charts/**'
      - 'deploy/**'
      - 'scripts/infrastructure/**'
      - 'tests/infrastructure/**'
      - '.github/workflows/infrastructure-checks.yaml'
      - '.tflint.hcl'
      - '.terraform-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'

permissions:
  contents: read

jobs:
  offline-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --group infrastructure --all-packages
      - run: make infra-tools
      - run: uv run --locked --group infrastructure python scripts/infrastructure/platform_artifacts.py install
      - name: Fetch checksum-locked service charts
        run: uv run --locked --group infrastructure python scripts/infrastructure/platform_services.py fetch
      - name: Fetch checksum-locked GPU Operator and patched NFD charts
        run: uv run --locked --group infrastructure python scripts/infrastructure/gpu_operator.py fetch
      - run: make infra-check
        env:
          # Plugin release metadata otherwise shares the runner's unauthenticated
          # GitHub API quota. This job token has contents:read only.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate HA database charts against pinned upstream schemas
        run: uv run --locked --group infrastructure python scripts/infrastructure/platform_checks.py --fetch-schemas
      - name: Validate native telemetry configuration without network or credentials
        run: uv run --locked --group infrastructure python scripts/infrastructure/telemetry_validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-telemetry-config-${{ github.sha }}
          path: artifacts/security/telemetry-config/
          if-no-files-found: ignore
          retention-days: 90
