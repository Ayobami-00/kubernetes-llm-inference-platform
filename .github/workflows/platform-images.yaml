name: Platform experiment images

on:
  push:
    branches: [codex/end-to-end-platform]
    paths: ['.github/workflows/platform-images.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-experiment-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify the repository's signed publishing identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { webcrypto } from 'node:crypto';
          try {
            const issuer = 'https://token.actions.githubusercontent.com';
            const audience = 'sts.amazonaws.com';
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', audience);
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('token request');
            const token = (await response.json()).value;
            const [encodedHeader, encodedPayload, encodedSignature] = token.split('.');
            const header = JSON.parse(Buffer.from(encodedHeader, 'base64url'));
            const claims = JSON.parse(Buffer.from(encodedPayload, 'base64url'));
            const keysResponse = await fetch(issuer + '/.well-known/jwks', {
              signal: AbortSignal.timeout(20000)
            });
            if (!keysResponse.ok || header.alg !== 'RS256') throw new Error('signing metadata');
            const jwk = (await keysResponse.json()).keys.find(key => key.kid === header.kid);
            if (!jwk) throw new Error('signing key');
            const key = await webcrypto.subtle.importKey('jwk', jwk, {
              name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256'
            }, false, ['verify']);
            const verified = await webcrypto.subtle.verify(
              'RSASSA-PKCS1-v1_5', key, Buffer.from(encodedSignature, 'base64url'),
              Buffer.from(encodedHeader + '.' + encodedPayload)
            );
            const now = Math.floor(Date.now() / 1000);
            const audiences = Array.isArray(claims.aud) ? claims.aud : [claims.aud];
            if (!verified || claims.iss !== issuer || !audiences.includes(audience) ||
                claims.exp <= now || claims.iat > now + 60 ||
                claims.repository !== process.env.GITHUB_REPOSITORY ||
                String(claims.repository_id) !== process.env.GITHUB_REPOSITORY_ID ||
                claims.ref !== process.env.GITHUB_REF) throw new Error('identity validation');
            const evidence = { verified: true };
            for (const name of ['iss', 'aud', 'sub', 'repository', 'repository_id',
                                'repository_owner_id', 'ref']) evidence[name] = claims[name];
            console.log('KLIP_OIDC_CLAIMS=' + JSON.stringify(evidence));
          } catch {
            console.error('Publishing identity audit failed; credential-bearing diagnostics withheld.');
            process.exit(1);
          }
          NODE

