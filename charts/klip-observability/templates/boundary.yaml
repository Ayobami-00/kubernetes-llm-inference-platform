{{- range $namespace, $security := dict "observability" "restricted" "observability-node-agents" "privileged" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    klip.dev/component: observability
    klip.dev/managed-by: klip-observability
    pod-security.kubernetes.io/enforce: {{ $security }}
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: telemetry-dns
  namespace: observability
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator-api
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app: kube-prometheus-stack-operator, release: klip-monitoring}
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports: [{port: '10250', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '10250', protocol: TCP}]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '443', protocol: TCP}, {port: '6443', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: object-metrics
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/instance: klip-monitoring}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '8080', protocol: TCP}, {port: '8081', protocol: TCP}]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '443', protocol: TCP}, {port: '6443', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: grafana}
      toPorts:
        - ports: [{port: '9090', protocol: TCP}, {port: '8080', protocol: TCP}, {port: '10902', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: thanos, app.kubernetes.io/component: query}
      toPorts:
        - ports: [{port: '10901', protocol: TCP}]
  egress:
    - toEntities: [cluster, kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - {port: '443', protocol: TCP}
            - {port: '6443', protocol: TCP}
            - {port: '10250', protocol: TCP}
            - {port: '9100', protocol: TCP}
            - {port: '9153', protocol: TCP}
            - {port: '9962', protocol: TCP}
            - {port: '9965', protocol: TCP}
            - {port: '9966', protocol: TCP}
            - {port: '8080', protocol: TCP}
            - {port: '8081', protocol: TCP}
            - {port: '9090', protocol: TCP}
            - {port: '9093', protocol: TCP}
            - {port: '9187', protocol: TCP}
            - {port: '3000', protocol: TCP}
            - {port: '3100', protocol: TCP}
            - {port: '3200', protocol: TCP}
            - {port: '8888', protocol: TCP}
            - {port: '10902', protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '9093', protocol: TCP}, {port: '8080', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: alertmanager}
      toPorts:
        - ports: [{port: '9094', protocol: TCP}, {port: '9094', protocol: UDP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: alertmanager}
      toPorts:
        - ports: [{port: '9094', protocol: TCP}, {port: '9094', protocol: UDP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aws-object-storage
  namespace: observability
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.policy.serviceaccount
        operator: In
        values: [klip-prometheus, klip-thanos-store, klip-thanos-compactor, klip-loki, klip-tempo, klip-alertmanager]
  egress:
    # Exact-subject IAM limits operations and buckets. This is HTTPS egress to
    # public endpoints, not a domain allowlist. Global IMDS deny remains enforced.
    - toEntities: [world]
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: host-metrics
  namespace: observability-node-agents
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: prometheus-node-exporter, app.kubernetes.io/instance: klip-monitoring}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '9100', protocol: TCP}]
  # Node exporters have no API/AWS token and need no network egress.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-query
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: thanos, app.kubernetes.io/instance: klip-thanos, app.kubernetes.io/component: query}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: grafana}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '9090', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: thanos, app.kubernetes.io/component: storegateway}
      toPorts:
        - ports: [{port: '10901', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-store
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: thanos, app.kubernetes.io/instance: klip-thanos, app.kubernetes.io/component: storegateway}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: thanos, app.kubernetes.io/component: query}
      toPorts:
        - ports: [{port: '10901', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '10902', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-compactor
  namespace: observability
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: thanos, app.kubernetes.io/instance: klip-thanos, app.kubernetes.io/component: compactor}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '10902', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: dashboards, namespace: observability}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: klip-grafana}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '3000', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: platform-data, cnpg.io/cluster: klip-db}
      toPorts:
        - ports: [{port: '5432', protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: thanos, app.kubernetes.io/component: query}
      toPorts:
        - ports: [{port: '9090', protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: loki, app.kubernetes.io/instance: klip-loki}
      toPorts:
        - ports: [{port: '3100', protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: tempo, app.kubernetes.io/instance: klip-tempo}
      toPorts:
        - ports: [{port: '3200', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: logs, namespace: observability}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: loki, app.kubernetes.io/instance: klip-loki}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: grafana}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/instance: klip-otel}
      toPorts:
        - ports: [{port: '3100', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: loki, app.kubernetes.io/instance: klip-loki}
      toPorts:
        - ports: [{port: '9095', protocol: TCP}, {port: '7946', protocol: TCP}, {port: '7946', protocol: UDP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: loki, app.kubernetes.io/instance: klip-loki}
      toPorts:
        - ports: [{port: '9095', protocol: TCP}, {port: '7946', protocol: TCP}, {port: '7946', protocol: UDP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: traces, namespace: observability}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: tempo, app.kubernetes.io/instance: klip-tempo}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/instance: klip-otel}
      toPorts:
        - ports: [{port: '4317', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: grafana}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '3200', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: telemetry-ingestion, namespace: observability}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/instance: klip-otel}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: klip, app.kubernetes.io/name: klip}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: klip, k8s:io.cilium.k8s.policy.serviceaccount: klip-runner}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: serving, app.kubernetes.io/part-of: klip-serving}
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability-node-agents, app.kubernetes.io/instance: klip-otel-agent}
      toPorts:
        - ports: [{port: '4317', protocol: TCP}, {port: '4318', protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: '8888', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: loki, app.kubernetes.io/instance: klip-loki}
      toPorts:
        - ports: [{port: '3100', protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: observability, app.kubernetes.io/name: tempo, app.kubernetes.io/instance: klip-tempo}
      toPorts:
        - ports: [{port: '4317', protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata:
  name: klip-thanos-stores
  namespace: observability
spec:
  type: ClusterIP
  clusterIP: None
  clusterIPs: [None]
  ipFamilies: [IPv4]
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/instance: klip-thanos
    app.kubernetes.io/component: storegateway
  ports:
    - {name: grpc, port: 10901, targetPort: grpc, protocol: TCP}
