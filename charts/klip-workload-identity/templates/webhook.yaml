{{- if not (regexMatch "^public[.]ecr[.]aws/eks/amazon-eks-pod-identity-webhook@sha256:[a-f0-9]{64}$" .Values.image) }}
{{- fail "Supply the verified immutable upstream webhook image" }}
{{- end }}
{{- if lt (int .Values.replicas) 2 }}
{{- fail "The identity webhook requires at least two replicas" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
# The external certificate path needs neither Secrets access nor the deprecated CSR API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
spec:
  secretName: {{ .Release.Name }}-tls
  dnsNames:
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
  isCA: true
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: {{ .Release.Name }}-selfsigned
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}}
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ .Release.Name }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
      containers:
        - name: webhook
          image: {{ .Values.image | quote }}
          command:
            - /webhook
            - --in-cluster=false
            - --port=8443
            - --metrics-port=9999
            - --tls-min-version=1.2
            - --token-audience=sts.amazonaws.com
            - --token-expiration=3600
            - --aws-default-region={{ .Values.region }}
            - --sts-regional-endpoint=true
            - --service-account-lookup-grace-period=100ms
            - --enable-debugging-handlers=false
          ports:
            - {name: https, containerPort: 8443}
            - {name: metrics, containerPort: 9999}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - {name: tls, mountPath: /etc/webhook/certs, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ .Release.Name }}
webhooks:
  - name: projected-token.klip.dev
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    reinvocationPolicy: IfNeeded
    admissionReviewVersions: [v1, v1beta1]
    sideEffects: None
    clientConfig:
      service:
        name: {{ .Release.Name }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        scope: Namespaced
    # Do not put admission for unrelated system Pods on this dependency path.
    matchConditions:
      - name: exact-workload-identities
        expression: >-
          has(object.spec.serviceAccountName) && ((request.namespace == 'kube-system' && object.spec.serviceAccountName in ['efs-csi-node-sa', 'ebs-csi-controller-sa']) ||
          (request.namespace == 'platform-data' && object.spec.serviceAccountName in ['klip-db', 'klip-db-restore']) ||
          (request.namespace == 'platform-identity-tests' && object.spec.serviceAccountName == 'identity-probe'))
