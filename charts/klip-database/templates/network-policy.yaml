{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {cnpg.io/cluster: {{ .Release.Name }}}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.managementRelease }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, migrate]
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }}
      ports: [{protocol: TCP, port: 8000}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports: [{protocol: TCP, port: 9187}]
{{- end }}
