# Install compatible CloudNativePG and Barman Cloud Plugin operators first.
# Image digests and credential values must come from verified operational inputs.
imageName: ""
instances: 3
storage:
  storageClass: ""
  size: 40Gi
walStorage:
  storageClass: ""
  size: 20Gi
nodeSelector:
  klip.dev.node-restriction.kubernetes.io/platform: "true"
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: "2", memory: 2Gi}
database: management
owner: management
applicationSecret: ""
bootstrap:
  mode: initdb
  recovery:
    destinationPath: ""
    serverName: ""
    target: {}
backup:
  destinationPath: ""
  authentication: secret
  credentialsSecret: ""
  roleArn: ""
  retentionPolicy: 30d
  schedule: "0 0 2 * * *"
  sidecarResources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
monitoring:
  enablePodMonitor: false
networkPolicy:
  enabled: true
  managementRelease: klip
  # Empty preserves same-namespace deployments. Live HA uses klip / platform-data.
  managementNamespace: ""
  operatorNamespace: cnpg-system
  monitoringNamespace: observability
