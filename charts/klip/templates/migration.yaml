# Database credentials must exist before this release. The separate database release runs first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ required "backend.image is required" .Values.backend.image | quote }}
          command: [sh, -c, "alembic -c apps/management/backend/alembic.ini upgrade head && management-init"]
          env:
            - name: MANAGEMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: MANAGEMENT_DATABASE_REQUIRE_TLS
              value: {{ .Values.database.requireTLS | quote }}
            {{- if .Values.database.caSecret }}
            - name: MANAGEMENT_DATABASE_CA_FILE
              value: /run/secrets/database/ca.crt
          volumeMounts:
            - {name: database-ca, mountPath: /run/secrets/database, readOnly: true}
            {{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      {{- if .Values.database.caSecret }}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caSecret }}
            items: [{key: {{ .Values.database.caKey }}, path: ca.crt}]
      {{- end }}
