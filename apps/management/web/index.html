<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d13" />
    <meta
      name="description"
      content="KLIP, the Kubernetes LLM Inference Platform. Manage customer workloads, GPU capacity and inference experiments."
    />
    <script>
      try {
        const appearance = localStorage.getItem('stratum-appearance');
        const theme =
          appearance === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : appearance === 'light'
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <title>KLIP · Kubernetes LLM Inference Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
