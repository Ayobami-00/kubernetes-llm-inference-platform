schema_version: '0.1'
id: code-agent
revision: 1
name: CodeAgent
notes: DRAFT experimental settings, not measured production behavior. Cognition/Devin-inspired coding
  workload. Exgentic is an independent public proxy.
model_alias: code-large
tier: dedicated
reserved_concurrency: 0
workload:
  task: coding
  dataset_ref: exgentic-code@1
  interaction: session
  preserve_recorded_context: true
generation:
  max_output_tokens: 2048
  temperature: 0.0
  streaming: true
limits:
  max_rendered_input_tokens: 16384
  max_inflight_requests: 8
  request_timeout_ms: 120000
traffic_allowance:
  unit: session
  sustained_per_second: 0.03333333333333333
  burst_per_second: 0.06666666666666667
  max_burst_duration_s: 60
slo:
  window_s: 300
  minimum_eligible_requests: 20
  targets:
  - metric: ttft_ms
    threshold_ms: 2000.0
    minimum_attainment_fraction: 0.95
quality:
  evaluator: not_evaluated
  notes: Recorded call replay does not execute tools, solve SWE-bench tasks, or measure agent success.
