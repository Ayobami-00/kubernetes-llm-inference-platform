schema_version: '0.1'
id: tutor-chat
revision: 1
name: TutorChat
notes: DRAFT experimental settings, not measured production behavior. MasterClass-inspired tutoring
  interaction. MathDial covers a narrower math domain.
model_alias: chat-small
tier: provisioned
reserved_concurrency: 2
workload:
  task: tutoring
  dataset_ref: mathdial@1
  interaction: session
  preserve_recorded_context: false
  prompt_template:
    system: Guide the student with a concise question or hint. Avoid giving away the solution.
    user: '{dialogue}'
generation:
  max_output_tokens: 512
  temperature: 0.7
  streaming: true
limits:
  max_rendered_input_tokens: 4096
  max_inflight_requests: 8
  request_timeout_ms: 60000
traffic_allowance:
  unit: session
  sustained_per_second: 0.2
  burst_per_second: 0.4
  max_burst_duration_s: 60
slo:
  window_s: 300
  minimum_eligible_requests: 20
  targets:
  - metric: ttft_ms
    threshold_ms: 1000.0
    minimum_attainment_fraction: 0.95
quality:
  evaluator: tutoring_reference_review
  notes: Reference-based pedagogical review is separate from performance; no judge implemented yet.
